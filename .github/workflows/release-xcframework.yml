name: Release XCFramework

on:
  workflow_call:
    secrets:
      GH_REPO_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  release-xcframework:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Get tag version
        id: get_tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate XCFramework
        run: ./gradlew --no-daemon assembleDoistxConfusablesReleaseXCFramework
        env:
          ORG_GRADLE_PROJECT_version: ${{ steps.get_tag_version.outputs.VERSION }}

      - name: Copy framework files to assets folder
        run: |
          mkdir assets
          cp -R build/XCFrameworks/release/DoistxConfusables.xcframework assets/
          cp build/XCFrameworks/release/Package.swift assets/

      - name: Verify Swift package manifest
        run: |
          swift package --package-path assets dump-package | jq -e '
            .targets[0] | .type == "binary" and .path == "DoistxConfusables.xcframework"
              and .url == null and .checksum == null
          '

      - name: Build Swift package consumer
        run: |
          for platform in 'iOS Simulator' 'watchOS Simulator'; do
            xcodebuild -scheme SwiftPackageSmokeTest \
              -destination "generic/platform=$platform" \
              -derivedDataPath "$RUNNER_TEMP/swift-package-smoke-test" \
              CODE_SIGNING_ALLOWED=NO build
          done
        working-directory: .github/swift-package-smoke-test

      - name: Push framework files to Doist/doistx-confusables-xcframework
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          VERSION: ${{ steps.get_tag_version.outputs.VERSION }}
        run: |
          # Extract author information from the current commit
          AUTHOR_NAME=$(git log -1 --pretty=format:'%an')
          AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')

          # Configure git with the original author
          git config --global user.name "$AUTHOR_NAME"
          git config --global user.email "$AUTHOR_EMAIL"

          # Create a temporary directory outside the repository
          TEMP_DIR=$(mktemp -d)
          cd $TEMP_DIR

          # Clone the target repository
          git clone https://x-access-token:${GH_REPO_TOKEN}@github.com/Doist/doistx-confusables-xcframework.git
          cd doistx-confusables-xcframework

          # Copy framework files over
          cp -R $GITHUB_WORKSPACE/assets/* .

          # Commit and push
          git add .
          git commit -m "Release version ${VERSION}"
          git tag "v${VERSION}"
          git push origin main --tags

          # Clean up
          cd $GITHUB_WORKSPACE
          rm -rf $TEMP_DIR

      - name: Compress framework files
        run: |
          7z a -r doistx-confusables.xcframework.zip DoistxConfusables.xcframework/ Package.swift
          rm -rf DoistxConfusables.xcframework/ Package.swift
        working-directory: assets

      - name: Add framework files to release
        run: gh release upload "$GITHUB_REF_NAME" assets/doistx-confusables.xcframework.zip --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
