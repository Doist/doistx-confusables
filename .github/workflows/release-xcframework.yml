name: Release XCFramework

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release-doistx-confusables-xcframework
  cancel-in-progress: false
  queue: max

jobs:
  release-xcframework:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Get tag version
        id: get_tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate XCFramework
        run: ./gradlew --no-daemon assembleDoistxConfusablesReleaseXCFramework
        env:
          ORG_GRADLE_PROJECT_version: ${{ steps.get_tag_version.outputs.VERSION }}

      - name: Copy framework files to assets folder
        run: |
          mkdir assets
          cp -R build/XCFrameworks/release/DoistxConfusables.xcframework assets/
          cp build/XCFrameworks/release/Package.swift assets/

      - name: Verify Swift package manifest
        run: |
          swift package --package-path assets dump-package | jq -e '
            .targets[0] | .type == "binary" and .path == "DoistxConfusables.xcframework"
              and .url == null and .checksum == null
          '

      - name: Build Swift package consumer
        run: |
          for platform in 'iOS Simulator' 'watchOS Simulator'; do
            xcodebuild -scheme SwiftPackageSmokeTest \
              -destination "generic/platform=$platform" \
              -derivedDataPath "$RUNNER_TEMP/swift-package-smoke-test" \
              CODE_SIGNING_ALLOWED=NO build
          done
        working-directory: .github/swift-package-smoke-test

      - name: Authenticate release bot
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DOIST_RELEASE_BOT_ID }}
          private-key: ${{ secrets.DOIST_RELEASE_BOT_PRIVATE_KEY }}
          owner: Doist
          repositories: doistx-confusables-xcframework
          permission-contents: write

      - name: Check publication state
        id: publication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: Doist/doistx-confusables-xcframework
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GH_REPO/git/matching-refs/tags/" | jq -r \
            --arg ref "refs/tags/$GITHUB_REF_NAME" '.[] | select(.ref == $ref) | .object.sha')
          if [[ -n "$tag" ]]; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            echo 'Already published. Leaving the release unchanged.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout XCFramework repository
        if: steps.publication.outputs.pending == 'true'
        uses: actions/checkout@v6
        with:
          repository: Doist/doistx-confusables-xcframework
          ref: main
          path: distribution
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Update XCFramework files
        if: steps.publication.outputs.pending == 'true'
        working-directory: distribution
        run: |
          rm -rf DoistxConfusables.xcframework Package.swift
          cp -a ../assets/DoistxConfusables.xcframework ../assets/Package.swift .
          git add -A -- DoistxConfusables.xcframework Package.swift
          git diff --cached --name-only --no-renames -z > "$RUNNER_TEMP/xcframework-paths"
          while IFS= read -r -d '' path; do
            if [[ ! "$path" =~ ^[a-zA-Z0-9_./-]+$ ]]; then
              echo '::error::Unsupported distribution filename for verified-bot-commit'
              exit 1
            fi
          done < "$RUNNER_TEMP/xcframework-paths"
        env:
          LC_ALL: C

      - name: Compress framework files
        if: steps.publication.outputs.pending == 'true'
        run: 7z a -r doistx-confusables.xcframework.zip DoistxConfusables.xcframework/ Package.swift
        working-directory: assets

      - name: Commit XCFramework release
        id: commit
        if: steps.publication.outputs.pending == 'true'
        uses: IAreKyleW00t/verified-bot-commit@1ee4374942e5c5f814e9b3121d766cbe45cea360 # v2.3.6
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Doist/doistx-confusables-xcframework
          workspace: distribution
          ref: refs/heads/main
          files: |
            DoistxConfusables.xcframework/**
            Package.swift
          message: Release version ${{ steps.get_tag_version.outputs.VERSION }}
          auto-stage: false
          allow-empty-commit: true
          update-local: false
          follow-symlinks: false
          force-push: false

      - name: Tag XCFramework release
        if: steps.publication.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: Doist/doistx-confusables-xcframework
          REF_SHA: ${{ steps.commit.outputs.ref }}
        run: |
          test -n "$REF_SHA"
          gh api "repos/$GH_REPO/git/refs" --method POST \
            -f ref="refs/tags/$GITHUB_REF_NAME" -f sha="$REF_SHA"

      - name: Add framework files to release
        if: steps.publication.outputs.pending == 'true'
        run: gh release upload "$GITHUB_REF_NAME" assets/doistx-confusables.xcframework.zip --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
