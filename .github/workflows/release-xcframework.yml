name: Release XCFramework

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release-xcframework-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-xcframework:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest

    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Get tag version
        id: get_tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate XCFramework
        run: ./gradlew --no-daemon assembleDoistxConfusablesReleaseXCFramework
        env:
          ORG_GRADLE_PROJECT_version: ${{ steps.get_tag_version.outputs.VERSION }}

      - name: Copy framework files to assets folder
        run: |
          mkdir assets
          cp -R build/XCFrameworks/release/DoistxConfusables.xcframework assets/
          cp build/XCFrameworks/release/Package.swift assets/

      - name: Verify Swift package manifest
        run: |
          swift package --package-path assets dump-package | jq -e '
            .targets[0] | .type == "binary" and .path == "DoistxConfusables.xcframework"
              and .url == null and .checksum == null
          '

      - name: Build Swift package consumer
        run: |
          for platform in 'iOS Simulator' 'watchOS Simulator'; do
            xcodebuild -scheme SwiftPackageSmokeTest \
              -destination "generic/platform=$platform" \
              -derivedDataPath "$RUNNER_TEMP/swift-package-smoke-test" \
              CODE_SIGNING_ALLOWED=NO build
          done
        working-directory: .github/swift-package-smoke-test

      # Installation tokens expire after one hour. Mint only after the build.
      - name: Authenticate release bot
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DOIST_RELEASE_BOT_ID }}
          private-key: ${{ secrets.DOIST_RELEASE_BOT_PRIVATE_KEY }}
          owner: Doist
          repositories: doistx-confusables-xcframework
          permission-contents: write

      - name: Check publication state
        id: publication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: Doist/doistx-confusables-xcframework
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GH_REPO/git/matching-refs/tags/" | jq -r \
            --arg ref "refs/tags/$GITHUB_REF_NAME" '.[] | select(.ref == $ref) | .object.sha')
          if [[ -n "$tag" ]]; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            echo 'Already published. Leaving the destination and release ZIP unchanged.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout XCFramework repository
        if: steps.publication.outputs.pending == 'true'
        uses: actions/checkout@v6
        with:
          repository: Doist/doistx-confusables-xcframework
          ref: main
          path: distribution
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Update XCFramework files
        if: steps.publication.outputs.pending == 'true'
        working-directory: distribution
        run: |
          # Replace, rather than overlay, so removed slices/files are deleted too.
          rm -rf DoistxConfusables.xcframework Package.swift
          cp -a ../assets/DoistxConfusables.xcframework ../assets/Package.swift .
          git add -A -- DoistxConfusables.xcframework Package.swift

      - name: Compress framework files
        if: steps.publication.outputs.pending == 'true'
        run: 7z a -r doistx-confusables.xcframework.zip DoistxConfusables.xcframework/ Package.swift
        working-directory: assets

      # Upload before tagging so a published destination always has its release ZIP.
      - name: Add framework files to release
        if: steps.publication.outputs.pending == 'true'
        run: gh release upload "$GITHUB_REF_NAME" assets/doistx-confusables.xcframework.zip --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and tag XCFramework release
        if: steps.publication.outputs.pending == 'true'
        working-directory: distribution
        shell: python
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: Doist/doistx-confusables-xcframework
          VERSION: ${{ steps.get_tag_version.outputs.VERSION }}
        run: |
          import base64
          import json
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args])

          def api(endpoint, payload, method="POST"):
              return json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['GH_REPO']}/git/{endpoint}",
                   "--method", method, "--input", "-"],
                  input=json.dumps(payload).encode(),
              ))

          # Recreate the entire index, preserving binary bytes, modes and deletions.
          tree = []
          for entry in git("ls-files", "--stage", "-z").split(b"\0"):
              if not entry:
                  continue
              metadata, path = entry.split(b"\t", 1)
              mode, oid, stage = metadata.decode().split()
              content = base64.b64encode(git("cat-file", "blob", oid)).decode()
              blob = api("blobs", {"content": content, "encoding": "base64"})
              tree.append({"path": path.decode(), "mode": mode, "type": "blob", "sha": blob["sha"]})
          tree_sha = api("trees", {"tree": tree})["sha"]
          # GitHub signs App API commits when author/committer/signature are omitted.
          commit = api("commits", {
              "message": f"Release version {os.environ['VERSION']}",
              "tree": tree_sha,
              "parents": [git("rev-parse", "HEAD").decode().strip()],
          })["sha"]
          api("refs/heads/main", {"sha": commit, "force": False}, "PATCH")
          api("refs", {"ref": f"refs/tags/{os.environ['GITHUB_REF_NAME']}", "sha": commit})
